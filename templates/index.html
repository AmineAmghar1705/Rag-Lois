<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Lois</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    textarea { width: 100%; height: 90px; font: inherit; padding: 8px; box-sizing: border-box; }
    button { margin-top: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
    #reponse { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; margin-top: 16px; }
    .cache { display: none; }
  </style>
</head>
<body>
  <h1>Questions sur le Code civil</h1>
  <p>Information générale, pas un conseil juridique.</p>

  <textarea id="question" maxlength="2000" placeholder="Ex. : À partir de quel âge peut-on se marier ?"></textarea>
  <button id="envoyer">Poser la question</button>

  <div id="reponse" class="cache"></div>
  <ul id="sources"></ul>

  <script>
    const bouton = document.getElementById("envoyer");
    const zoneReponse = document.getElementById("reponse");
    const listeSources = document.getElementById("sources");

    bouton.addEventListener("click", async () => {
      const question = document.getElementById("question").value;
      bouton.disabled = true;
      zoneReponse.classList.remove("cache");
      zoneReponse.textContent = "Recherche en cours…";
      listeSources.innerHTML = "";

      try {
        const res = await fetch("/api/question", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question }),
        });
        const data = await res.json();

        if (!res.ok) {
          zoneReponse.textContent = data.erreur;
          return;
        }

        zoneReponse.textContent = data.reponse;
        for (const s of data.sources) {
          const li = document.createElement("li");
          const lien = document.createElement("a");
          lien.href = s.lien;
          lien.target = "_blank";
          lien.textContent = `${s.code}, art. ${s.num}`;
          li.append(lien, ` (score ${s.score})`);
          listeSources.append(li);
        }
      } catch (e) {
        zoneReponse.textContent = "Erreur : le serveur ne répond pas.";
      } finally {
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
